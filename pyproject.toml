[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speakhired"
version = "0.1.0"
description = "Offline, free, voice-first English and interview coach for IT people"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "trafilatura>=1.12",
]

[project.optional-dependencies]
voice = ["faster-whisper>=1.0", "av>=14,<19", "kokoro>=0.9", "soundfile>=0.12", "numpy"]
nlp = ["language-tool-python>=2.8"]
lev = ["lev[train] @ git+https://github.com/InterfazeAI/lev#subdirectory=packages/lev"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "reportlab>=4"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["apps/api"]

[tool.setuptools.package-data]
speakhired = ["data/*.json"]
